# Proposes updates to the pinned actions. Each proposal is a pull request that CI checks
# and the operator reviews. The cooldown keeps a release out until it has had a week to
# be noticed if it is bad. Grouping puts every action update of one week into a single
# pull request, which keeps review and CI load to one run a week.
#
# Add the project's own package ecosystem below, for example `cargo`, `uv`, `pip` or
# `npm`, with the same schedule, cooldown and grouping. A project that pins its
# dependencies exactly by decision may leave them out and update them by hand, and
# should say so here. So may a project whose manifest has path dependencies outside
# the repository, such as a Cargo dependency on ../other/crate, because Dependabot
# checks out only this repository and fails with path_dependencies_not_reachable.
#
# Dependabot opens its pull requests against the default branch. A project that
# integrates on a version branch adds `target-branch: v0.2.3`, or whichever branch is
# current, to each entry, and moves it when that branch changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
