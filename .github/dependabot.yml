# Proposes updates to the pinned actions. Each proposal is a pull request that CI checks
# and the operator reviews. The cooldown keeps a release out until it has had a week to
# be noticed if it is bad.
#
# Add the project's own package ecosystem below, for example `cargo`, `uv`, `pip` or
# `npm`, with the same schedule and cooldown. A project that pins its dependencies
# exactly by decision may leave them out and update them by hand, and should say so here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
